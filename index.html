  <style>
    body { background: #07070a; color: #e9e6df; }

    .grain::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; opacity: .06;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");

<body class="grain font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    /* =====================================================================
       1. DATOS
       ---------------------------------------------------------------------
       IMPORTANTE PARA LA TESIS:
       - Los textos "cita", "sinopsis" y "madridRepresentado" son BORRADORES
         ilustrativos para demostrar el sistema: sustitúyelos por tu análisis.
       - "verificada: false" marca localizaciones que debes contrastar con una
         fuente antes de citarlas. La web muestra esa etiqueta.
       - Para añadir una obra, copia un objeto del array y cambia sus campos.
       ===================================================================== */
    const OBRAS = [
      {
        id: 'mujeres-al-borde', titulo: 'Mujeres al borde de un ataque de nervios', tipo: 'Cine', anio: 1988,
        director: 'Pedro Almodóvar', genero: 'Comedia',
        imagen: 'Imagenesok/mujeres.jpeg',
        cita: 'Madrid como decorado emocional: un pop saturado donde la ciudad importa menos como lugar reconocible que como estado de ánimo.',
        sinopsis: 'Pepa, actriz de doblaje, intenta localizar a su amante Iván antes de que desaparezca de su vida. En su ático se cruzan una amiga en crisis, un hijo con su novia y una cadena de malentendidos que transforman el hogar en un vodevil urbano a toda velocidad.',
        madridRepresentado: { titulo: 'El Madrid de la Movida y el pop', texto: 'La comedia de finales de los 80 muestra una capital moderna, colorista y doméstica. El espacio urbano se condensa en el interior (la terraza, el taxi, el aeropuerto) y funciona como escenografía de una modernidad española recién estrenada.' },
        localizaciones: [
          { nombre: 'Ático de Pepa (terraza)', barrio: 'Centro', zona: 'centro', nota: 'Eje dramático de la película. Localización exacta pendiente de contrastar.', verificada: false },
          { nombre: 'Aeropuerto de Madrid-Barajas', barrio: 'Barajas', zona: 'periferia', nota: 'Escena final de huida y persecución. Pendiente de contrastar.', verificada: false },
        ],
      },
      {
        id: 'el-dia-de-la-bestia', titulo: 'El día de la bestia', tipo: 'Cine', anio: 1995,
        director: 'Álex de la Iglesia', genero: 'Terror / Comedia negra',
        cita: 'La Gran Vía y las torres de la Castellana se vuelven un mapa de lo sagrado y lo profano: el Madrid navideño como ciudad apocalíptica.',
        sinopsis: 'Un sacerdote cree haber descifrado el lugar y la fecha exactos del nacimiento del Anticristo en Madrid durante la Nochebuena. Para impedirlo decide cometer todos los pecados posibles y se alía con un aficionado al heavy metal y un presentador de televisión esotérico.',
        madridRepresentado: { titulo: 'El Madrid apocalíptico', texto: 'La capital aparece como un laberinto vertical de luces, carteles y azoteas. Los iconos arquitectónicos de los 90 (el letrero publicitario, las torres inclinadas) se convierten en escenario de una comedia negra donde el skyline es un personaje.' },
        localizaciones: [
          { nombre: 'Edificio Carrión (letrero de Schweppes), Gran Vía / Callao', barrio: 'Centro', zona: 'centro', nota: 'Clímax de la película en la azotea.', verificada: true },
          { nombre: 'Puerta de Europa (Torres KIO), Plaza de Castilla', barrio: 'Tetuán', zona: 'eje', nota: 'Las torres inclinadas actúan como contrapunto moderno.', verificada: true },
        ],
      },
      {
        id: 'abre-los-ojos', titulo: 'Abre los ojos', tipo: 'Cine', anio: 1997,
        director: 'Alejandro Amenábar', genero: 'Thriller',
        cita: 'Una Gran Vía vacía rompe la convención: la ciudad más ruidosa del país se transforma en espacio mental, una pesadilla sin gente.',
        sinopsis: 'César, un joven atractivo y acomodado, sufre un accidente que altera su rostro y su percepción de la realidad. Despierta en un Madrid desierto y empieza a dudar de qué es real y qué es una construcción de su mente.',
        madridRepresentado: { titulo: 'El Madrid onírico y desierto', texto: 'La película explota la imagen de una gran avenida sin tráfico ni peatones para hablar de aislamiento y de identidad. La capital se vuelve un espacio de irrealidad y simulacro.' },
        localizaciones: [
          { nombre: 'Gran Vía (secuencia de la avenida vacía)', barrio: 'Centro', zona: 'centro', nota: 'Una de las imágenes más reconocibles del cine español de los 90.', verificada: true },
        ],
      },
      {
        id: 'volver', titulo: 'Volver', tipo: 'Cine', anio: 2006,
        director: 'Pedro Almodóvar', genero: 'Drama',
        cita: 'El barrio frente al centro: la periferia obrera como territorio de memoria, comunidad femenina y luto.',
        sinopsis: 'Raimunda, trabajadora de un barrio madrileño, intenta sacar adelante a su hija y a su familia mientras reaparece el fantasma de su madre, que parecía muerta. Entre secretos y cuidados se tejen los lazos de varias generaciones de mujeres.',
        madridRepresentado: { titulo: 'El Madrid de barrio y la periferia', texto: 'Alejada del Madrid monumental, la película muestra una capital de bloques, patios y vecinas. El vínculo entre la ciudad y el pueblo de origen expresa el tema de la migración interior hacia Madrid.' },
        localizaciones: [
          { nombre: 'Barrio de Vallecas (escenas urbanas)', barrio: 'Puente de Vallecas', zona: 'periferia', nota: 'Ambiente de barrio popular madrileño. Calles concretas pendientes de contrastar.', verificada: false },
        ],
      },
      {
        id: 'la-casa-de-papel', titulo: 'La casa de papel', tipo: 'Serie', anio: 2017,
        director: 'Álex Pina (creador)', genero: 'Acción / Atraco',
        cita: 'Madrid como símbolo institucional: la fachada de una "Fábrica de Moneda" que concentra el imaginario del poder económico.',
        sinopsis: 'Un grupo de atracadores dirigido por «el Profesor» se encierra en la Fábrica Nacional de Moneda y Timbre con rehenes para imprimir su propio dinero. La serie se convirtió en fenómeno global tras su difusión en plataforma.',
        madridRepresentado: { titulo: 'El Madrid-marca de la era streaming', texto: 'La capital funciona como telón de fondo reconocible para una audiencia internacional. La serie reelabora un edificio real en emblema del poder y de la ciudad "asaltable", con una imagen más global que local.' },
        localizaciones: [
          { nombre: 'Sede del CSIC, calle Serrano 117', barrio: 'Chamartín', zona: 'eje', nota: 'Exterior usado para representar la Fábrica de Moneda y Timbre.', verificada: true },
        ],
      },
      {
        id: 'antidisturbios', titulo: 'Antidisturbios', tipo: 'Serie', anio: 2020,
        director: 'Rodrigo Sorogoyen (creador)', genero: 'Drama policial',
        cita: 'Un Madrid sin postal: la ciudad como terreno de conflicto social, desahucios y violencia institucional.',
        sinopsis: 'Seis agentes de una unidad antidisturbios participan en un desahucio que termina con una muerte. La investigación posterior expone el corporativismo, la presión interna y la fractura entre policía y sociedad.',
        madridRepresentado: { titulo: 'El Madrid de la crisis y el conflicto', texto: 'La serie renuncia a los iconos turísticos para mostrar calles, comisarías y portales. La capital aparece como espacio de desigualdad y tensión, lejos de la imagen promocional de la ciudad.' },
        localizaciones: [
          { nombre: 'Lavapiés (escena del desahucio)', barrio: 'Centro', zona: 'centro', nota: 'Barrio asociado al conflicto en el relato. Localización exacta pendiente de contrastar.', verificada: false },
        ],
      },
    ];

    /* Posiciones aproximadas de los distritos en el mapa ESQUEMÁTICO (en % del lienzo). No es cartografía. */
    const DISTRITOS = [
      { id: 'Moncloa', x: 20, y: 34 }, { id: 'Chamberí', x: 42, y: 31 }, { id: 'Tetuán', x: 50, y: 14 },
      { id: 'Chamartín', x: 70, y: 22 }, { id: 'Barajas', x: 90, y: 38 }, { id: 'Centro', x: 46, y: 52 },
      { id: 'Salamanca', x: 68, y: 44 }, { id: 'Retiro', x: 62, y: 62 }, { id: 'Carabanchel', x: 20, y: 72 },
      { id: 'Usera', x: 38, y: 84 }, { id: 'Puente de Vallecas', x: 70, y: 80 },
    ];

    const ZONAS = {
      centro: { label: 'Centro histórico', color: 'bg-amber-screen' },
      eje: { label: 'Ensanche y eje Castellana', color: 'bg-sky-400' },
      periferia: { label: 'Periferia', color: 'bg-butaca' },
    };

    /* Línea del tiempo: cómo cambia la imagen de Madrid (resumen para completar con tu marco teórico). */
    const EPOCAS = [
      { id: 'pioneros', rango: '1895 – 1915', titulo: 'Pioneros del cine español', resumen: 'La llegada del cinematógrafo a la vida de los españoles, primeras imágenes de la ciudad de Madrid, vistas y paisajes, costumbrismo y verbenas.', ejemplos: ['Puerta del Sol (1896)', 'El barberillo de Lavapiés (1910)'], imagen: 'Entre la Villa y la Corte' },
      { id: 'cine silente maduro', rango: '1915 – 1930', titulo: 'Cine silente maduro', resumen: 'Consolidación de la industria, entre el costumbrismo y la vanguardia, en busca de la identidad.', ejemplos: ['La chavala (1924)', '¡Viva Madrid, que es mi pueblo! (1928)'], imagen: 'Consolidación de la industria' },
      { id: 'cine sonoro', rango: '1930 – 1939', titulo: 'El cine de la Segunda República y la Guerra Civil', resumen: 'De la zarzuela al star system español, estudios y productoras, luces y sombras de un periodo convulso.', ejemplos: ['La verbena de la Paloma (1935)', 'Frente de Madrid (1939)'], imagen: 'El cine militante' },
      { id: 'clasico', rango: '1940 – 1959', titulo: 'Cine de posguerra, Cine de evasión', resumen: 'Madrid como capital institucional y escaparate del régimen, pero también como ciudad de la inmigración interior y la penuria de posguerra.', ejemplos: ['Surcos (1951)', 'Muerte de un ciclista (1955)'], imagen: 'Autarquía, folclore, comedias y el costumbrismo de los barrios' },
      { id: 'estudios', rango: '1960 – 1969', titulo: 'Superproducción y decorado', resumen: 'Los estudios en las afueras convierten el entorno madrileño en plató para grandes producciones internacionales, desarrollismo.', ejemplos: ['55 días en Pekín (1963)', 'La ciudad no es para mí (1966)'], imagen: 'Madrid a todo color' },
      { id: 'transicion', rango: '1970 – 1981', titulo: 'Tardofranquismo y Transición', resumen: 'Cambio político y social. La cámara se acerca a los márgenes: la delincuencia juvenil y los suburbios sustituyen la postal oficial.', ejemplos: ['La semana del asesino (1972)', 'Deprisa, deprisa (1981)'], imagen: 'La ciudad real, sin filtro' },
      { id: 'movida', rango: '1982 – 1989', titulo: 'La Movida', resumen: 'Madrid se presenta como capital moderna, festiva y creativa: el color, la noche y la libertad se convierten en marca de identidad.', ejemplos: ['Colegas (1982)', 'Mujeres al borde de un ataque de nervios (1988)'], imagen: 'La capital como símbolo de modernidad' },
      { id: 'noventa', rango: '1990 – 1999', titulo: 'Resaca Post-92 y desencanto', resumen: 'Madrid precario: el renacer del cine social. Género y fábula: el thriller y la comedia negra exploran una ciudad inquietante y grotesca.', ejemplos: ['El día de la bestia (1995)', 'Hola, ¿estás sola? (1995)'], imagen: 'La ciudad desencantada' },
      { id: 'cosmopolita', rango: '2000 – 2009', titulo: 'Madrid en crecimiento y transformación', resumen: 'Convive la capital global con el cine de barrio y de memoria, el thriller de asfalto.', ejemplos: ['El bola (2000)', 'Volver (2006)'], imagen: 'Entre el nuevo skyline y el nuevo barrio' },
      { id: 'multiplataforma', rango: '2010 – hoy', titulo: 'Plataformas y streaming, Gentrificación y Neo-Noir', resumen: 'La ficción seriada y la distribución global proyectan una imagen de Madrid hecha para audiencias internacionales, con series que también retratan el conflicto social.', ejemplos: ['Los ilusos (2013)', 'La casa de papel (2017)', 'Antidisturbios (2020)', 'Valeria (2020)'], imagen: 'Madrid-marca y Madrid-conflicto' },
    ];

    /* =====================================================================
       2. UTILIDADES
       ===================================================================== */
    const epocaDe = (a) => (a < 1990 ? '80s' : a < 2000 ? '90s' : a < 2010 ? '2000s' : 'Actual');
    const norm = (s) => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    // Tono estable por obra para generar un "cartel" con degradado propio
    const tonoDe = (id) => [...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

    /* Icono Lucide dibujado con React a partir de window.lucide.icons (evita conflictos con el DOM virtual).
       Si Lucide no cargase (sin conexión), no se rompe nada: simplemente no hay icono. */
    function Icon({ name, size = 18, className = '' }) {
      const ALIAS = { ChartColumn: 'BarChart3', CircleAlert: 'AlertCircle', SearchX: 'Search' }; // nombres alternativos según versión de Lucide
      const set = window.lucide && window.lucide.icons;
      const raw = set && (set[name] || set[ALIAS[name]]);
      if (!raw) return <span style={{ width: size, height: size, display: 'inline-block' }} />;
      const nodes = raw[0] === 'svg' ? raw[2] : raw;
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
          {nodes.map(([tag, attrs], i) => React.createElement(tag, { key: i, ...attrs }))}
        </svg>
      );
    }

    /* Contador animado (para el panel de estadísticas) */
    function CountUp({ to, suffix = '' }) {
      const [v, setV] = useState(0);
      useEffect(() => {
        let raf, t0;
        const step = (t) => { t0 = t0 || t; const p = Math.min((t - t0) / 900, 1); setV(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [to]);
      return <>{v}{suffix}</>;
    }

    /* =====================================================================
       3. COMPONENTES
       ===================================================================== */

    /* --- Etiquetas pequeñas --- */
    const TipoBadge = ({ tipo }) => (
      <span className={`inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-[11px] font-medium tracking-wide uppercase ${tipo === 'Serie' ? 'bg-sky-400/15 text-sky-300 ring-1 ring-sky-400/30' : 'bg-amber-screen/15 text-amber-screen ring-1 ring-amber-screen/30'}`}>
        <Icon name={tipo === 'Serie' ? 'Tv' : 'Film'} size={12} /> {tipo}
      </span>
    );

        /* --- Tarjeta individual de obra --- */
    function Card({ obra, onOpen }) {
      return (
        <div className="group relative flex flex-col justify-between overflow-hidden rounded-2xl border border-white/5 bg-ink-800/50 p-5 transition-all duration-300 hover:-translate-y-1 hover:border-white/10 hover:bg-ink-800">
          
          {/* 🆕 Si la película tiene una propiedad 'imagen', se muestra aquí arriba */}
          {obra.imagen && (
            <div className="-mx-5 -mt-5 mb-4 overflow-hidden rounded-t-2xl border-b border-white/5">
              <img 
                src={obra.imagen} 
                alt={obra.titulo} 
                className="w-full h-44 object-cover opacity-85 transition-transform duration-500 group-hover:scale-105 group-hover:opacity-100" 
              />
            </div>
          )}

          <div>
            <div className="flex items-center justify-between text-xs text-zinc-500">
              <span className="inline-flex items-center gap-1 font-medium uppercase tracking-wider text-zinc-400">
                <span className="h-1.5 w-1.5 rounded-full bg-[#D4AF37]" />
                {obra.tipo}
              </span>
              <span className="font-mono">{obra.anio}</span>
            </div>
            
            <h3 className="mt-3 font-display text-xl font-bold leading-snug text-white group-hover:text-amber-screen">
              {obra.titulo}
            </h3>
            
            <p className="mt-1 text-sm text-zinc-400">
              <span className="text-zinc-500">De</span> {obra.director} <span className="mx-1.5 text-zinc-600">·</span> <span className="text-xs text-zinc-500">{obra.genero}</span>
            </p>
            
            {obra.cita && (
              <blockquote className="mt-4 border-l-2 border-[#D4AF37]/30 pl-3 text-xs italic leading-relaxed text-zinc-400">
                "{obra.cita}"
              </blockquote>
            )}
          </div>
          
          <div className="mt-5 flex items-center justify-between border-t border-white/5 pt-3">
            <span className="inline-flex items-center gap-1 text-[11px] font-medium text-zinc-500">
              <Icon name="MapPin" size={12} className="text-[#D4AF37]/70" />
              {obra.localizaciones.length} loc.
            </span>
            <button onClick={() => onOpen(obra)} className="inline-flex items-center gap-1 text-xs font-semibold text-[#D4AF37] hover:text-white transition">
              Ver ficha <Icon name="ArrowRight" size={12} />
            </button>
          </div>
        </div>
      );
    }

    /* --- Modal de detalle --- */
    function Modal({ obra, onClose }) {
      useEffect(() => {
        const onKey = (e) => e.key === 'Escape' && onClose();
        document.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [onClose]);
      const h = tonoDe(obra.id);
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/80 p-0 backdrop-blur-sm sm:items-center sm:p-6" onClick={onClose} role="dialog" aria-modal="true" aria-label={obra.titulo}>
          <div className="modal-in relative max-h-[92vh] w-full max-w-3xl overflow-y-auto rounded-t-3xl border border-white/10 bg-ink-900 sm:rounded-3xl" onClick={(e) => e.stopPropagation()}>
            <div className="relative px-6 pb-8 pt-8 sm:px-10" style={{ background: `linear-gradient(160deg, hsl(${h} 50% 20%), #0c0c11 75%)` }}>
              <button onClick={onClose} aria-label="Cerrar" className="absolute right-4 top-4 rounded-full bg-black/40 p-2 text-zinc-300 hover:bg-black/70 hover:text-white"><Icon name="X" size={20} /></button>
              <div className="mb-3 flex flex-wrap items-center gap-2"><TipoBadge tipo={obra.tipo} /><span className="text-sm text-zinc-300">{obra.anio} · {obra.genero}</span></div>
              <h2 className="font-display text-3xl font-extrabold leading-tight text-white sm:text-4xl">{obra.titulo}</h2>
              <p className="mt-2 flex items-center gap-2 text-zinc-300"><Icon name="Clapperboard" size={16} />{obra.director}</p>
            </div>

            <div className="space-y-8 px-6 py-8 sm:px-10">
              <section>
                <h3 className="mb-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-[.18em] text-amber-screen"><Icon name="BookOpen" size={14} /> Sinopsis · espacio urbano</h3>
                <p className="leading-relaxed text-zinc-300">{obra.sinopsis}</p>
              </section>

              <section className="rounded-2xl border border-butaca/30 bg-butaca/5 p-5">
                <h3 className="mb-1 flex items-center gap-2 text-xs font-semibold uppercase tracking-[.18em] text-butaca"><Icon name="Building2" size={14} /> Madrid representado</h3>
                <p className="font-display text-xl font-semibold text-white">{obra.madridRepresentado.titulo}</p>
                <p className="mt-2 leading-relaxed text-zinc-300">{obra.madridRepresentado.texto}</p>
              </section>

              <section>
                <h3 className="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-[.18em] text-amber-screen"><Icon name="MapPin" size={14} /> Localizaciones reales</h3>
                <ul className="space-y-2">
                  {obra.localizaciones.map((l) => (
                    <li key={l.nombre} className="flex gap-3 rounded-xl border border-white/10 bg-ink-800 p-4">
                      <span className={`mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full ${ZONAS[l.zona].color}`} />
                      <div className="min-w-0">
                        <p className="font-medium text-white">{l.nombre}</p>
                        <p className="text-sm text-zinc-400">{l.barrio} · {ZONAS[l.zona].label}</p>
                        <p className="mt-1 text-sm text-zinc-300">{l.nota}</p>
                        <p className={`mt-2 inline-flex items-center gap-1 text-xs ${l.verificada ? 'text-emerald-400' : 'text-zinc-500'}`}>
                          <Icon name={l.verificada ? 'BadgeCheck' : 'CircleAlert'} size={13} />{l.verificada ? 'Localización contrastada' : 'Pendiente de contrastar con fuente'}
                        </p>
                      </div>
                    </li>
                  ))}
                </ul>
              </section>
              <p className="text-xs text-zinc-500">Los textos analíticos son un borrador ilustrativo del repositorio; sustitúyelos por el análisis de la tesis.</p>
            </div>
          </div>
        </div>
      );
    }

    /* --- Hero con buscador y filtros rápidos --- */
    function Hero({ f, setF, directores, generos, total, mostrados }) {
      const chip = (activo) => `rounded-full border px-4 py-1.5 text-sm transition ${activo ? 'border-amber-screen bg-amber-screen text-black font-medium' : 'border-white/15 text-zinc-300 hover:border-white/40'}`;
      const sel = 'w-full appearance-none rounded-xl border border-white/10 bg-ink-800 px-4 py-2.5 text-sm text-zinc-200 focus:border-amber-screen focus:outline-none';
      return (
        <header className="relative overflow-hidden border-b border-white/5">
          <div className="beam absolute inset-0" />
          <div className="relative mx-auto max-w-6xl px-5 pb-14 pt-16 text-center sm:pt-24">
            <p className="mb-5 inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-1.5 text-xs font-semibold uppercase tracking-[.25em] text-zinc-200">
              <Icon name="GraduationCap" size={14} /> Un proyecto de @NicoGrijalba
            </p>
            <h1 className="font-display text-5xl font-extrabold leading-[1.05] text-white sm:text-7xl">
  Madrid <em className="text-[#D4AF37] not-italic">de Cine</em>
</h1>
            <p className="mx-auto mt-5 max-w-2xl text-center text-balance text-lg text-[#D4AF37] font-bold tracking-tight">
  La imagen de Madrid en el cine español: fichas, mapas, cronología y datos de más de un siglo de ciudad filmada.
</p>


            {/* Buscador */}
            <div className="mx-auto mt-10 max-w-2xl">
              <label className="relative block">
                <Icon name="Search" size={20} className="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500" />
                <input value={f.q} onChange={(e) => setF({ ...f, q: e.target.value })} placeholder="Busca por título, director, lugar o tema…"
                  className="w-full rounded-2xl border border-white/10 bg-ink-800/90 py-4 pl-12 pr-4 text-base text-white placeholder:text-zinc-500 focus:border-amber-screen focus:outline-none focus:ring-2 focus:ring-amber-screen/30" />
              </label>
            </div>

            {/* Filtros rápidos */}
            <div className="mx-auto mt-6 max-w-4xl space-y-4">
              <div className="flex flex-wrap items-center justify-center gap-2">
                <span className="mr-1 text-xs uppercase tracking-widest text-zinc-500">Época</span>
                {['Todas', 'Inicios', '10s', '20s', '30s', '40s', '50s', '60s', '70s', '80s', '90s', '2000s', '2010s', '2020s', 'Actual'].map((e) => (
                  <button key={e} onClick={() => setF({ ...f, epoca: e })} className={chip(f.epoca === e)}>{e}</button>
                ))}
              </div>
              <div className="flex flex-wrap items-center justify-center gap-2">
                <span className="mr-1 text-xs uppercase tracking-widest text-zinc-500">Tipo</span>
                {['Todos', 'Cine', 'Serie'].map((t) => (
                  <button key={t} onClick={() => setF({ ...f, tipo: t })} className={chip(f.tipo === t)}>{t}</button>
                ))}
              </div>
              <div className="grid gap-3 sm:grid-cols-2">
                <select aria-label="Director o creador" value={f.director} onChange={(e) => setF({ ...f, director: e.target.value })} className={sel}>
                  <option value="Todos">Director / creador: todos</option>
                  {directores.map((d) => <option key={d}>{d}</option>)}
                </select>
                <select aria-label="Género" value={f.genero} onChange={(e) => setF({ ...f, genero: e.target.value })} className={sel}>
                  <option value="Todos">Género: todos</option>
                  {generos.map((g) => <option key={g}>{g}</option>)}
                </select>
              </div>
              <p className="text-sm text-zinc-500" aria-live="polite">{mostrados} de {total} fichas
                {(f.q || f.época !== 'Todas' || f.tipo !== 'Todos' || f.director !== 'Todos' || f.genero !== 'Todos') && (
                  <button onClick={() => setF({ q: '', época: 'Todas', tipo: 'Todos', director: 'Todos', genero: 'Todos' })} className="ml-3 text-amber-screen underline-offset-4 hover:underline">Limpiar filtros</button>
                )}
              </p>
            </div>
          </div>
        </header>
      );
    }

    /* --- Pestaña: Repositorio (grid) --- */
    function Repositorio({ obras, onOpen }) {
      if (!obras.length) return (
        <div className="py-24 text-center text-zinc-500"><Icon name="SearchX" size={40} className="mx-auto mb-3" /><p>Ninguna ficha coincide con estos filtros.</p></div>
      );
      return <div className="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">{obras.map((o) => <Card key={o.id} obra={o} onOpen={onOpen} />)}</div>;
    }

    /* --- Pestaña: Mapa esquemático por distritos --- */
    function Mapa({ onOpen }) {
      const [sel, setSel] = useState('Centro');
      // Agrupa localizaciones por distrito
      const porBarrio = useMemo(() => {
        const m = {};
        OBRAS.forEach((o) => o.localizaciones.forEach((l) => { (m[l.barrio] = m[l.barrio] || []).push({ ...l, obra: o }); }));
        return m;
      }, []);
      const detalle = porBarrio[sel] || [];
      return (
        <div className="grid gap-6 lg:grid-cols-5">
          <div className="lg:col-span-3">
            {/* Lienzo: anillo M-30 y río Manzanares dibujados con SVG; los distritos son botones posicionados en % */}
            <div className="relative aspect-[4/3] w-full overflow-hidden rounded-3xl border border-white/10 bg-ink-800">
              <svg viewBox="0 0 400 300" className="absolute inset-0 h-full w-full" aria-hidden="true">
                <ellipse cx="200" cy="155" rx="150" ry="120" fill="none" stroke="#2a2a37" strokeWidth="2" strokeDasharray="6 6" />
                <path d="M60 70 C 90 120, 110 170, 120 230 S 150 290, 175 300" fill="none" stroke="#1d3a52" strokeWidth="6" strokeLinecap="round" opacity=".7" />
                <path d="M0 150 H400 M200 0 V300" stroke="#1c1c26" strokeWidth="1" />
              </svg>
              {DISTRITOS.map((d) => {
                const n = (porBarrio[d.id] || []).length;
                const activo = sel === d.id;
                return (
                  <button key={d.id} onClick={() => setSel(d.id)} style={{ left: `${d.x}%`, top: `${d.y}%` }} aria-pressed={activo}
                    className={`absolute -translate-x-1/2 -translate-y-1/2 rounded-full border text-center transition focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-screen ${n ? 'border-amber-screen/60 bg-amber-screen/15 px-3 py-2 text-amber-screen hover:bg-amber-screen/30' : 'border-white/10 bg-white/5 px-2.5 py-1.5 text-zinc-500 hover:text-zinc-300'} ${activo ? 'ring-2 ring-amber-screen scale-110' : ''}`}>
                    <span className="block text-xs font-medium leading-tight">{d.id}</span>
                    {n > 0 && <span className="block text-[10px] opacity-80">{n} loc.</span>}
                  </button>
                );
              })}
              <p className="absolute bottom-3 left-4 text-[11px] text-zinc-500">Mapa esquemático, no a escala · posiciones aproximadas</p>
            </div>
            <div className="mt-3 flex flex-wrap gap-4 text-xs text-zinc-400">
              {Object.entries(ZONAS).map(([k, z]) => <span key={k} className="inline-flex items-center gap-1.5"><span className={`h-2.5 w-2.5 rounded-full ${z.color}`} />{z.label}</span>)}
            </div>
          </div>

          <aside className="lg:col-span-2">
            <h3 className="mb-3 flex items-center gap-2 font-display text-2xl font-semibold text-white"><Icon name="MapPin" size={20} className="text-amber-screen" />{sel}</h3>
            {detalle.length === 0 ? (
              <p className="rounded-2xl border border-dashed border-white/10 p-6 text-sm text-zinc-500">Aún no hay localizaciones registradas en este distrito. Añádelas en el array OBRAS.</p>
            ) : (
              <ul className="space-y-3">
                {detalle.map((l) => (
                  <li key={l.obra.id + l.nombre}>
                    <button onClick={() => onOpen(l.obra)} className="w-full rounded-xl border border-white/10 bg-ink-800 p-4 text-left transition hover:border-amber-screen/40">
                      <p className="font-medium text-white">{l.nombre}</p>
                      <p className="text-sm text-amber-screen">{l.obra.titulo} <span className="text-zinc-500">({l.obra.anio})</span></p>
                      <p className="mt-1 text-sm text-zinc-400">{l.nota}</p>
                    </button>
                  </li>
                ))}
              </ul>
            )}
          </aside>
        </div>
      );
    }

    /* --- Pestaña: Línea del tiempo --- */
    function Cronologia() {
      const [i, setI] = useState(0);
      const e = EPOCAS[i];
      return (
        <div>
          <div className="relative mb-10 overflow-x-auto pb-4">
            <div className="relative flex min-w-[820px] justify-between">
              <div className="absolute left-0 right-0 top-[11px] h-px bg-white/15" />
              {EPOCAS.map((ep, idx) => (
                <button key={ep.id} onClick={() => setI(idx)} className="group relative z-10 flex w-28 flex-col items-center text-center focus:outline-none">
                  <span className={`h-[23px] w-[23px] rounded-full border-2 transition ${idx === i ? 'scale-125 border-amber-screen bg-amber-screen' : 'border-zinc-600 bg-ink-950 group-hover:border-amber-screen'}`} />
                  <span className={`mt-3 text-xs font-medium ${idx === i ? 'text-amber-screen' : 'text-zinc-500'}`}>{ep.rango}</span>
                  <span className={`mt-1 text-[13px] leading-tight ${idx === i ? 'text-white' : 'text-zinc-500'}`}>{ep.titulo}</span>
                </button>
              ))}
            </div>
          </div>
          <article key={e.id} className="fade-in grid gap-8 rounded-3xl border border-white/10 bg-ink-800 p-8 md:grid-cols-5">
            <div className="md:col-span-3">
              <p className="text-sm font-medium uppercase tracking-[.2em] text-amber-screen">{e.rango}</p>
              <h3 className="mt-2 font-display text-3xl font-semibold text-white">{e.titulo}</h3>
              <p className="mt-4 leading-relaxed text-zinc-300">{e.resumen}</p>
              <div className="mt-6 flex gap-2">
                <button disabled={i === 0} onClick={() => setI(i - 1)} className="inline-flex items-center gap-1 rounded-full border border-white/15 px-4 py-2 text-sm text-zinc-300 hover:border-white/40 disabled:opacity-30"><Icon name="ChevronLeft" size={16} />Anterior</button>
                <button disabled={i === EPOCAS.length - 1} onClick={() => setI(i + 1)} className="inline-flex items-center gap-1 rounded-full border border-white/15 px-4 py-2 text-sm text-zinc-300 hover:border-white/40 disabled:opacity-30">Siguiente<Icon name="ChevronRight" size={16} /></button>
              </div>
            </div>
            <div className="md:col-span-2">
              <p className="rounded-2xl border-l-2 border-butaca bg-butaca/5 p-4 font-display text-lg italic text-white">“{e.imagen}”</p>
              <p className="mb-2 mt-6 text-xs font-semibold uppercase tracking-[.18em] text-zinc-500">Obras de referencia</p>
              <ul className="space-y-1.5 text-sm text-zinc-300">{e.ejemplos.map((x) => <li key={x} className="flex items-start gap-2"><Icon name="Film" size={14} className="mt-0.5 shrink-0 text-amber-screen" />{x}</li>)}</ul>
            </div>
          </article>
          <p className="mt-4 text-xs text-zinc-500">Esquema orientativo para desarrollar con tu marco teórico. Las obras de referencia anteriores a 1988 no tienen ficha en este repositorio todavía.</p>
        </div>
      );
    }

    /* --- Pestaña: Estadísticas (calculadas en vivo sobre el array OBRAS) --- */
    function Estadisticas() {
      const s = useMemo(() => {
        const locs = OBRAS.flatMap((o) => o.localizaciones);
        const porZona = Object.keys(ZONAS).map((k) => ({ k, n: locs.filter((l) => l.zona === k).length }));
        const dir = {};
        OBRAS.forEach((o) => { const d = o.director.replace(/\s*\(.*\)/, ''); dir[d] = (dir[d] || 0) + 1; });
        const directores = Object.entries(dir).sort((a, b) => b[1] - a[1]);
        const epocas = ['80s', '90s', '2000s', 'Actual'].map((e) => ({ e, n: OBRAS.filter((o) => epocaDe(o.anio) === e).length }));
        return { total: OBRAS.length, locs: locs.length, cine: OBRAS.filter((o) => o.tipo === 'Cine').length, serie: OBRAS.filter((o) => o.tipo === 'Serie').length, contrastadas: locs.filter((l) => l.verificada).length, porZona, directores, epocas };
      }, []);
      const pct = (n, t) => (t ? Math.round((n / t) * 100) : 0);
      const Barra = ({ label, valor, total, color = 'bg-amber-screen' }) => (
        <div>
          <div className="mb-1 flex justify-between text-sm"><span className="text-zinc-300">{label}</span><span className="text-zinc-500">{valor} · {pct(valor, total)}%</span></div>
          <div className="h-2.5 overflow-hidden rounded-full bg-white/5"><div className={`h-full rounded-full ${color} transition-all duration-700`} style={{ width: `${pct(valor, total)}%` }} /></div>
        </div>
      );
      const Contador = ({ n, label, icon }) => (
        <div className="rounded-2xl border border-white/10 bg-ink-800 p-5">
          <Icon name={icon} size={20} className="text-amber-screen" />
          <p className="mt-3 font-display text-4xl font-extrabold text-white"><CountUp to={n} /></p>
          <p className="text-sm text-zinc-400">{label}</p>
        </div>
      );
      return (
        <div className="space-y-8">
          <div className="grid grid-cols-2 gap-4 md:grid-cols-4">
            <Contador n={s.total} label="Fichas en el repositorio" icon="Library" />
            <Contador n={s.locs} label="Localizaciones registradas" icon="MapPin" />
            <Contador n={s.cine} label="Películas" icon="Film" />
            <Contador n={s.serie} label="Series" icon="Tv" />
          </div>
          <div className="grid gap-6 md:grid-cols-2">
            <section className="space-y-4 rounded-3xl border border-white/10 bg-ink-800 p-6">
              <h3 className="font-display text-xl font-semibold text-white">Localizaciones por zona</h3>
              {s.porZona.map((z) => <Barra key={z.k} label={ZONAS[z.k].label} valor={z.n} total={s.locs} color={ZONAS[z.k].color} />)}
            </section>
            <section className="space-y-4 rounded-3xl border border-white/10 bg-ink-800 p-6">
              <h3 className="font-display text-xl font-semibold text-white">Directores y creadores más presentes</h3>
              {s.directores.map(([d, n]) => <Barra key={d} label={d} valor={n} total={s.total} color="bg-butaca" />)}
            </section>
            <section className="space-y-4 rounded-3xl border border-white/10 bg-ink-800 p-6">
              <h3 className="font-display text-xl font-semibold text-white">Fichas por época</h3>
              {s.epocas.map((x) => <Barra key={x.e} label={x.e} valor={x.n} total={s.total} color="bg-sky-400" />)}
            </section>
            <section className="rounded-3xl border border-white/10 bg-ink-800 p-6">
              <h3 className="font-display text-xl font-semibold text-white">Rigor de las fuentes</h3>
              <p className="mt-3 font-display text-5xl font-extrabold text-white"><CountUp to={pct(s.contrastadas, s.locs)} suffix="%" /></p>
              <p className="mt-1 text-sm text-zinc-400">de las localizaciones están marcadas como contrastadas ({s.contrastadas} de {s.locs}).</p>
            </section>
          </div>
          <p className="text-xs text-zinc-500">Todas las cifras se calculan en vivo a partir del array OBRAS: crecerán solas a medida que añadas fichas. Con 6 obras de muestra, son ilustrativas, no resultados de investigación.</p>
        </div>
      );
    }

    /* =====================================================================
       4. APLICACIÓN
       ===================================================================== */
    function App() {
      const [tab, setTab] = useState('repo');
      const [f, setF] = useState({ q: '', epoca: 'Todas', tipo: 'Todos', director: 'Todos', genero: 'Todos' });
      const [abierta, setAbierta] = useState(null);

      const directores = useMemo(() => [...new Set(OBRAS.map((o) => o.director))].sort(), []);
      const generos = useMemo(() => [...new Set(OBRAS.map((o) => o.genero))].sort(), []);

      const filtradas = useMemo(() => {
        const q = norm(f.q.trim());
        return OBRAS.filter((o) => {
          if (f.epoca !== 'Todas' && epocaDe(o.anio) !== f.epoca) return false;
          if (f.tipo !== 'Todos' && o.tipo !== f.tipo) return false;
          if (f.director !== 'Todos' && o.director !== f.director) return false;
          if (f.genero !== 'Todos' && o.genero !== f.genero) return false;
          if (!q) return true;
          const texto = norm([o.titulo, o.director, o.genero, o.cita, o.sinopsis, o.madridRepresentado.titulo, ...o.localizaciones.map((l) => l.nombre + ' ' + l.barrio)].join(' '));
          return texto.includes(q);
        }).sort((a, b) => a.anio - b.anio);
      }, [f]);

      const tabs = [
        { id: 'repo', label: 'Repositorio', icon: 'LayoutGrid' },
        { id: 'mapa', label: 'Mapa de localizaciones', icon: 'Map' },
        { id: 'tiempo', label: 'Evolución cronológica', icon: 'History' },
        { id: 'stats', label: 'Estadísticas', icon: 'ChartColumn' },
      ];

      return (
        <>
          <Hero f={f} setF={(v) => { setF(v); setTab('repo'); }} directores={directores} generos={generos} total={OBRAS.length} mostrados={filtradas.length} />

          {/* Navegación por pestañas (sticky) */}
          <nav className="sticky top-0 z-40 border-b border-white/5 bg-ink-950/85 backdrop-blur" aria-label="Secciones">
            <div className="mx-auto flex max-w-6xl gap-1 overflow-x-auto px-5">
              {tabs.map((t) => (
                <button key={t.id} onClick={() => setTab(t.id)} aria-current={tab === t.id ? 'page' : undefined}
                  className={`flex shrink-0 items-center gap-2 border-b-2 px-4 py-4 text-sm transition ${tab === t.id ? 'border-amber-screen text-white' : 'border-transparent text-zinc-500 hover:text-zinc-200'}`}>
                  <Icon name={t.icon} size={16} />{t.label}
                </button>
              ))}
            </div>
          </nav>

          <main className="mx-auto max-w-6xl px-5 py-12">
            {tab === 'repo' && <Repositorio obras={filtradas} onOpen={setAbierta} />}
            {tab === 'mapa' && <Mapa onOpen={setAbierta} />}
            {tab === 'tiempo' && <Cronologia />}
            {tab === 'stats' && <Estadisticas />}
          </main>

          <footer className="border-t border-red/5 py-10 text-center text-xs text-zinc-600">
            <p>Madrid en la Pantalla · Repositorio visual de tesis doctoral · Textos analíticos de muestra: sustituir por el análisis definitivo.</p>
          </footer>

          {abierta && <Modal obra={abierta} onClose={() => setAbierta(null)} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
